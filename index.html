<!-- AUTOMATIC BACKGROUND MUSIC -->
<audio id="backgroundMusic" autoplay loop preload="auto">
    <source src="./Love.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("backgroundMusic");

// Set volume
music.volume = 0.5;

// Get previous music position
const savedTime = localStorage.getItem("siteMusicTime");

// Restore previous position
music.addEventListener("loadedmetadata", function() {

    if (savedTime !== null) {
        music.currentTime = Number(savedTime);
    }

    // Automatically play music
    music.play().catch(error => {
        console.log("Autoplay was blocked by the browser.");
    });

}, { once: true });

// Save music position continuously
music.addEventListener("timeupdate", function() {
    localStorage.setItem("siteMusicTime", music.currentTime);
});

// Save position before leaving page
window.addEventListener("pagehide", function() {
    localStorage.setItem("siteMusicTime", music.currentTime);
});

</script>
